services:
  minecraft-server:
    image: itzg/minecraft-server:2026.5.2-java25
    container_name: minecraft-server
    tty: true
    stdin_open: true
    environment:
      EULA: "true"
      TZ: "Europe/Prague"
      MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"
      TYPE: "PAPER"
      # VIEW_DISTANCE = chunks sent to clients (cheap). SIMULATION_DISTANCE =
      # chunks the server ticks (expensive). Keep them decoupled; see
      # ARCHITECTURE.md section 12.
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 4
      GUI: "FALSE"
      VERSION: "26.1.2"
      DIFFICULTY: "normal"
      MODE: "survival"
      SERVER_NAME: "Salosianska LAN party"
      ICON: "https://raw.githubusercontent.com/Salesiani-Pardubice/.github/refs/heads/main/assets/logotypes/logo-SDB-color.png"
      PVP: "true"
      ENABLE_QUERY: "TRUE"
      MAX_PLAYERS: 20
      ENABLE_COMMAND_BLOCK: "FALSE"
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "TRUE"
      ALLOW_FLIGHT: "FALSE"
      ENABLE_STATUS: "TRUE"
      SPAWN_PROTECTION: "0"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      # Break-glass owner only. Ops are managed through the admin panel over
      # RCON; this list is MERGEd on every start, so any name left here would
      # be silently re-added after being removed. See ARCHITECTURE.md section 7.
      OPS: |
        petrkucerak
      ENABLE_AUTOPAUSE: "FALSE"
      MAX_TICK_TIME: "-1"
      MAX_WORLD_SIZE: 2000
      SPAWN_RADIUS: 4
      ENTITY_BROADCAST_RANGE_PERCENTAGE: 50
      USES_PLUGINS: true
      MODRINTH_PROJECTS: |
        worldedit:7.4.5
        worldguard:7.0.18
        coreprotect:24.0
        squaremap:1.3.13.1

    volumes:
      - ./data:/data
    ports:
      - "25565:25565"
    restart: unless-stopped
    networks:
      - mcnet

  mc-backup:
    image: itzg/mc-backup:2026.5.0
    container_name: mc-backup
    depends_on:
      - minecraft-server
    environment:
      TZ: "Europe/Prague"
      RCON_HOST: minecraft-server
      INITIAL_DELAY: "2m"
      BACKUP_INTERVAL: "24h"
      PRUNE_BACKUPS_DAYS: "14"
      BACKUP_NAME: "world"
    volumes:
      - ./data:/data:ro
      - /home/pedro/backups:/backups
    restart: unless-stopped
    networks:
      - mcnet

  admin-api:
    build: ./admin-api
    image: salesiani/minecraft-admin-api:0.1.0
    container_name: admin-api
    environment:
      TZ: "Europe/Prague"
      ADDR: ":8080"
      MAP_DIR: "/srv/map"
    volumes:
      # squaremap renders static tiles here; we serve them directly rather than
      # exposing the plugin's own webserver.
      - ./data/plugins/squaremap/web:/srv/map:ro
    depends_on:
      - minecraft-server
    restart: unless-stopped
    networks:
      - mcnet

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      # Passed by environment rather than on the command line, so the token
      # does not show up in `ps` output for every local user.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - minecraft-server
    restart: unless-stopped
    networks:
      - mcnet

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.16
    container_name: playit-agent
    network_mode: host
    environment:
      - SECRET_KEY=${SECRET_KEY}
    restart: unless-stopped

networks:
  mcnet:
    driver: bridge
